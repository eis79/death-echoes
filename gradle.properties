# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=ua.eismont.deathechoes
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Death Echoes
mod_author=eismont
mod_id=deathechoes
license=MIT
credits=
description=Your deaths leave ghostly echoes behind - translucent replays of your final moments. Right-click your echo to reclaim lost XP.
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.93
## Dependency range declared in neoforge.mods.toml - intentionally looser than neoforge_version
## (which pins the exact build used to compile against) so this mod has no NeoForge-build-specific
## dependencies and isn't blocked from running on other NeoForge 26.1.2.x builds.
neoforge_version_range=[26.1.2,)
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Publishing (fill after creating the platform projects; tokens go to env vars MODRINTH_TOKEN / CURSEFORGE_TOKEN)
modrinth_project_id=CSulgWNl
curseforge_project_id=1641764
